# Qasr al-Adala — PostgreSQL + one-off migrations + application.
#
#   cp .env.docker.example .env.docker      # then set real secrets
#   docker compose --env-file .env.docker up -d --build
#   docker compose --env-file .env.docker run --rm migrate npm run office:create -- …   (first office)
#
# The database port is not published. Put a TLS-terminating reverse proxy in front of `app`
# (session cookies are Secure-only in production) and set PUBLIC_URL to its https:// address.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: qasr
      POSTGRES_DB: qasr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qasr -d qasr"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Applies pending migrations (never resets data), then exits.
  migrate:
    build:
      context: .
      target: build
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://qasr:${POSTGRES_PASSWORD}@db:5432/qasr
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://qasr:${POSTGRES_PASSWORD}@db:5432/qasr
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${PUBLIC_URL:?Set PUBLIC_URL (https://…)}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-قصر العدالة <no-reply@example.tn>}
      REMINDER_WORKER: "true"
    ports:
      - "${APP_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
